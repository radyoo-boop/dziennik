name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod projektu
        uses: actions/checkout@v4

      - name: Skonfiguruj Javę (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Sprawdź strukturę projektu
        run: |
          echo "Aktualny katalog:"
          pwd
          echo "Pliki projektu:"
          ls -la
          echo "Poszukiwanie gradlew:"
          find . -name gradlew -type f

      - name: Znajdź Gradle Wrapper
        run: |
          GRADLEW=$(find . -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "BŁĄD: Nie znaleziono pliku gradlew!"
            exit 1
          fi
          chmod +x "$GRADLEW"
          echo "GRADLEW=$GRADLEW" >> $GITHUB_ENV

      - name: Zbuduj plik APK
        run: |
          cd "$(dirname "$GRADLEW")"
          ./gradlew assembleDebug

      - name: Udostępnij gotowy plik APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error

